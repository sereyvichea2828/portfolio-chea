<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Pearl Glass Container Linear Gradient -->
    <linearGradient id="pearlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FAF9FF" />
      <stop offset="100%" stop-color="#ECE8FC" />
    </linearGradient>

    <!-- Subtle Pearl Border Gradient -->
    <linearGradient id="pearlBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="50%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="monogramGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Light Reflection -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#ambientGlow)" />

  <!-- Base Pearl Glass Tile -->
  <rect
    x="6"
    y="6"
    width="116"
    height="116"
    rx="28"
    fill="url(#pearlBg)"
    stroke="url(#pearlBorder)"
    stroke-width="3"
  />

  <!-- Geometric DT Monogram -->
  <g transform="translate(18, 29.5) scale(1.15)">
    <path
      d="M 4 4
         L 76 4
         L 76 14
         L 61 14
         L 61 54
         L 52 45
         L 52 14
         L 43.5 14
         C 45.8 16.5 47 20 47 25
         L 47 33
         C 47 43 41 54 29 54
         L 2 54
         L 2 20
         L 12 20
         L 12 44
         L 28 44
         C 34 44 37 39 37 32
         L 37 27
         C 37 20 34 15 28 14
         L 14 14
         Z"
      fill="url(#monogramGradient)"
    />
  </g>

  <!-- Violet Accent Gem Dot -->
  <circle cx="98" cy="98" r="4" fill="#7C3AED" />
</svg>
